kind: ZarfPackageConfig
metadata:
  name: uds-next-bravo
  version: 0.1.0
  description: Tiny bravo workload for the UDS CLI Next demo
components:
  - name: bravo
    required: true
    images:
      - registry.k8s.io/pause:3.10
    manifests:
      - name: workload
        namespace: uds-next-bravo
        template: true
        files:
          - manifests/deployment.yaml
